<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><defs><marker id="a-0B6E3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B6E3A"/></marker><marker id="a-0A2A5E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A5E"/></marker><marker id="a-5B6474" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6474"/></marker><marker id="a-B42318" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a-0E5E6F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E5E6F"/></marker><marker id="a-7A1F3D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A1F3D"/></marker><marker id="a-8A5300" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A5300"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="52" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" fill="#0A2A5E" text-anchor="start">Text similarity gets both pairs backwards</text><text x="40" y="88" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#5B6474" text-anchor="start">So we match on specifications, not spelling.</text><rect x="30" y="130" width="1540" height="262" rx="14" fill="#FAFBFD" stroke="#C9D1DC" stroke-width="1.5"/><text x="56" y="168" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="800" fill="#0B6E3A" text-anchor="start">SAME BEARING</text><text x="56" y="192" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#5B6474" text-anchor="start">few shared words, same part</text><rect x="56" y="214" width="560" height="54" rx="8" fill="#fff" stroke="#C9D1DC" stroke-width="1.5"/><text x="74" y="248" font-family="'IBM Plex Mono',Consolas,monospace" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">SKF 6205-2RS DEEP GROOVE BALL BEARING</text><rect x="56" y="284" width="560" height="54" rx="8" fill="#fff" stroke="#C9D1DC" stroke-width="1.5"/><text x="74" y="318" font-family="'IBM Plex Mono',Consolas,monospace" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">FAG 6205-2RSR BEARING, 25X52X15MM, SEALED</text><text x="660" y="234" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#5B6474" text-anchor="start">Text similarity</text><rect x="660" y="252" width="300" height="22" rx="5" fill="#E9EDF3" stroke="none" stroke-width="1.5"/><rect x="660" y="252" width="249.89999999999998" height="22" rx="5" fill="#9AA6B8" stroke="none" stroke-width="1.5"/><text x="660" y="314" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#16202E" text-anchor="start">0.833</text><text x="790" y="314" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#5B6474" text-anchor="start">a text matcher is unsure</text><text x="1010" y="234" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#5B6474" text-anchor="start">Specifications, field by field</text><text x="1010" y="264" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#0B6E3A" text-anchor="start">✓ 6205 = 6205</text><text x="1010" y="290" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#0B6E3A" text-anchor="start">✓ 25 × 52 × 15 mm from ISO 15</text><text x="1010" y="316" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#0B6E3A" text-anchor="start">✓ 2RS = 2RSR (sealed)</text><text x="1010" y="342" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#0B6E3A" text-anchor="start">✓ brand ignored</text><rect x="1330" y="226" width="216" height="70" rx="10" fill="#0B6E3A" stroke="none" stroke-width="1.5"/><text x="1438" y="270" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">MATCH  0.971</text><rect x="30" y="420" width="1540" height="262" rx="14" fill="#FAFBFD" stroke="#C9D1DC" stroke-width="1.5"/><text x="56" y="458" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="800" fill="#B42318" text-anchor="start">DIFFERENT STEEL</text><text x="56" y="482" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#5B6474" text-anchor="start">one character apart, never interchangeable</text><rect x="56" y="504" width="560" height="54" rx="8" fill="#fff" stroke="#C9D1DC" stroke-width="1.5"/><text x="74" y="538" font-family="'IBM Plex Mono',Consolas,monospace" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">GASKET SPIRAL WOUND SS316 4IN 150#</text><rect x="56" y="574" width="560" height="54" rx="8" fill="#fff" stroke="#C9D1DC" stroke-width="1.5"/><text x="74" y="608" font-family="'IBM Plex Mono',Consolas,monospace" font-size="17" font-weight="400" fill="#16202E" text-anchor="start">GASKET SPIRAL WOUND SS304 4IN 150#</text><text x="660" y="524" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#5B6474" text-anchor="start">Text similarity</text><rect x="660" y="542" width="300" height="22" rx="5" fill="#E9EDF3" stroke="none" stroke-width="1.5"/><rect x="660" y="542" width="296.7" height="22" rx="5" fill="#9AA6B8" stroke="none" stroke-width="1.5"/><text x="660" y="604" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#16202E" text-anchor="start">0.989</text><text x="790" y="604" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#5B6474" text-anchor="start">a text matcher says: same</text><text x="1010" y="524" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#5B6474" text-anchor="start">Specifications, field by field</text><text x="1010" y="554" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#B42318" text-anchor="start">✗ SS316 ≠ SS304  (veto)</text><text x="1010" y="580" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#0B6E3A" text-anchor="start">✓ 4 in = 4 in</text><text x="1010" y="606" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#0B6E3A" text-anchor="start">✓ 150# = 150#</text><text x="1010" y="632" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#5B6474" text-anchor="start">↳ if the grade matched: 0.956</text><rect x="1330" y="516" width="216" height="70" rx="10" fill="#B42318" stroke="none" stroke-width="1.5"/><text x="1438" y="560" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">REFUSED  0</text><text x="40" y="706" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#16202E" text-anchor="start">The pair that must never merge scores HIGHER on text (0.989) than the pair that should (0.833). No threshold fixes an inverted order.</text></svg>