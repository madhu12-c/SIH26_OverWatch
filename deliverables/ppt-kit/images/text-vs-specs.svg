<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640"><defs><marker id="a-0B6E3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B6E3A"/></marker><marker id="a-0A2A5E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A2A5E"/></marker><marker id="a-5B6474" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6474"/></marker><marker id="a-B42318" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a-0E5E6F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E5E6F"/></marker><marker id="a-7A1F3D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A1F3D"/></marker><marker id="a-8A5300" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A5300"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="52" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="28" font-weight="800" fill="#0A2A5E" text-anchor="start">Merges made with no person involved</text><text x="40" y="86" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#5B6474" text-anchor="start">Same 15,000 records and candidate pairs · each text method at its best setting, tuned on one half, scored on the half it never saw</text><rect x="1180" y="30" width="18" height="18" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="1206" y="45" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#16202E" text-anchor="start">right</text><rect x="1280" y="30" width="18" height="18" rx="3" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="1306" y="45" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#16202E" text-anchor="start">wrong</text><text x="40" y="174" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#16202E" text-anchor="start">Fuzzy string match</text><rect x="330" y="152" width="45.2409046214356" height="36" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="377.2409046214356" y="152" width="659.5870206489675" height="36" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="1048.827925270403" y="177" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="400" fill="#16202E" text-anchor="start">3,120 wrong of 3,334  ·  1,468 traps</text><text x="40" y="286" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#16202E" text-anchor="start">TF-IDF</text><rect x="330" y="264" width="33.61356932153392" height="36" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="365.61356932153393" y="264" width="412.87610619469024" height="36" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="790.4896755162242" y="289" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="400" fill="#16202E" text-anchor="start">1,953 wrong of 2,112  ·  1,121 traps</text><text x="40" y="398" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#16202E" text-anchor="start">Sentence embeddings</text><rect x="330" y="376" width="60.250737463126846" height="36" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.5"/><rect x="392.2507374631268" y="376" width="799.7492625368732" height="36" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="1204.0" y="401" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="400" fill="#16202E" text-anchor="start">3,783 wrong of 4,068  ·  1,697 traps</text><text x="40" y="510" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="800" fill="#0A2A5E" text-anchor="start">Ours: specifications</text><rect x="330" y="488" width="45.87512291052114" height="36" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="389.87512291052116" y="513" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="700" fill="#16202E" text-anchor="start">217 merged  ·  0 wrong  ·  0 traps</text><text x="40" y="612" font-family="'Noto Sans','Segoe UI',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#5B6474" text-anchor="start">No text threshold reaches zero wrong: two different items can share identical text once SAP&#x27;s 40-character field cuts them. Ours finds about as many duplicates with none of the wrong merges.</text></svg>