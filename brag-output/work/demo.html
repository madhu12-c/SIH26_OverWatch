<!doctype html>
<html><head><meta charset="utf-8"><title>Prototype walkthrough</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans:wght@400;500;600;700;800&display=block">
<style>
  :root { --ground:#F3F5F9; --navy:#0A2A5E; --accent:#0F4C9C; --good:#0B6E3A; --danger:#B42318; --saffron:#FF9933;
          --ink:#16202E; --faint:#5B6474; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:var(--ground); font-family:'Noto Sans',sans-serif; }
  .abs { position:absolute; }
  #cam { position:absolute; left:0; top:0; width:1920px; transform-origin:0 0; }
  #cam img { position:absolute; left:0; top:0; width:1920px; opacity:0; }
  .ring { position:absolute; border:5px solid var(--danger); border-radius:6px; opacity:0; }
  #cursor { position:absolute; left:0; top:0; width:34px; height:34px; transform-origin:0 0; filter:drop-shadow(0 3px 4px rgba(0,0,0,.28)); }
  #ripple { position:absolute; border-radius:50%; border:3px solid var(--accent); opacity:0; }
  #band { left:0; top:950px; width:1920px; height:130px; background:#0A2A5E; }
  #cap { left:80px; top:950px; height:130px; width:1760px; display:flex; align-items:center; font-size:40px; font-weight:700;
         color:#fff; line-height:1.25; }
  #tag { right:28px; top:24px; font-family:'IBM Plex Mono',monospace; font-size:18px; letter-spacing:.1em; color:#fff;
         background:rgba(10,42,94,.92); padding:8px 14px; border-radius:3px; }
  #step { left:80px; top:908px; font-family:'IBM Plex Mono',monospace; font-size:20px; letter-spacing:.12em; color:#fff;
          background:var(--accent); padding:6px 14px; border-radius:3px; }
  .card { position:absolute; inset:0; background:var(--ground); opacity:0; }
</style></head>
<body>
<div id="cam"><div id="imgs"></div><div id="rings"></div><div id="ripple"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.9 L11.6 21.6 L14.6 20.3 L11.6 13.7 L17.8 13.7 Z"
    fill="#fff" stroke="#0A2A5E" stroke-width="1.4" stroke-linejoin="round"/></svg>
</div>
<div class="abs" id="band"></div>
<div class="abs" id="step"></div>
<div class="abs" id="cap"></div>
<div class="abs" id="tag">REAL PROTOTYPE · RUNNING OFFLINE</div>

<!-- opening and closing cards -->
<div class="card" id="open">
  <div class="abs" style="left:0; width:1920px; top:380px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:26px;
       letter-spacing:.16em; color:var(--faint)">PROTOTYPE WALKTHROUGH</div>
  <div class="abs" style="left:0; width:1920px; top:430px; text-align:center; font-size:84px; font-weight:800; color:var(--navy)">Inside the prototype</div>
  <div class="abs" style="left:0; width:1920px; top:570px; text-align:center; font-size:36px; color:var(--ink)">
    The real portal, running offline. AI read every record once, in advance.</div>
</div>
<div class="card" id="end">
  <svg class="abs" style="left:885px; top:300px" width="150" height="150" viewBox="0 0 52 52">
    <circle cx="26" cy="26" r="24.5" fill="none" stroke="#FF9933" stroke-width="2"/><circle cx="26" cy="26" r="21" fill="#0A2A5E"/>
    <rect x="12" y="15" width="7" height="6" rx="1" fill="#fff" fill-opacity=".92"/><rect x="12" y="23" width="7" height="6" rx="1" fill="#fff" fill-opacity=".92"/>
    <rect x="12" y="31" width="7" height="6" rx="1" fill="#fff" fill-opacity=".92"/>
    <path d="M20 18c4 0 5 8 9 8M20 26h9M20 34c4 0 5-8 9-8" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="29" y="20" width="12" height="12" rx="1.5" fill="#FF9933"/>
    <path d="m32 26 2.2 2.2 4-4.6" fill="none" stroke="#061C40" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="abs" style="left:0; width:1920px; top:492px; text-align:center; font-size:84px; font-weight:800; color:var(--navy)">One Nation, One Material Code</div>
  <div class="abs" style="left:900px; top:626px; width:120px; height:5px; background:var(--saffron); border-radius:3px"></div>
  <div class="abs" style="left:0; width:1920px; top:660px; text-align:center; font-size:34px; color:var(--faint)">
    We match on specifications, not spelling. Rules decide every merge.</div>
  <div class="abs" style="left:0; width:1920px; top:720px; text-align:center; font-size:30px; color:var(--faint)">
    Team Overwatch · SIH26099 · Prototype</div>
</div>

<script>
// ---------------- timeline (seconds). Rects are page pixels [x, y, width]; height = width * 9/16.
const OPEN = [0, 3.8], END = [99.4, 104.0];
const SHOTS = [
 { step: '1 · SIGN IN', t: [3.8, 12.6], imgs: [[3.8, 'login_a'], [6.6, 'login_b']],
   cams: [[3.8, [150, 80, 1640]], [7.4, [150, 80, 1640]], [9.0, [1010, 700, 880]], [12.6, [1010, 706, 880]]],
   cur: [[4.4, [960, 720]], [6.2, [1175, 508]], [8.2, [1175, 560]], [10.6, [1300, 1077]], [12.6, [1300, 1077]]],
   clicks: [6.3, 10.8], rings: [],
   caps: [[4.1, 'Sign in as a CPCL reviewer. Each role sees only what it may decide.']] },
 { step: '2 · THE MATCH', t: [12.6, 25.4], imgs: [[12.6, 'match']],
   cams: [[12.6, [584, 226, 1012]], [17.6, [584, 232, 1012]], [18.6, [560, 640, 1080]], [22.0, [560, 660, 1080]], [22.9, [570, 900, 1036]], [25.4, [570, 910, 1036]]],
   cur: [[12.9, [1300, 700]], [15.0, [1440, 530]], [17.6, [1440, 530]], [19.6, [1090, 1066]], [22.6, [1090, 1066]], [24.0, [800, 1230]]],
   clicks: [], rings: [[15.2, 17.9, [590, 477, 996, 111], 'danger'], [19.8, 22.4, [590, 1036, 996, 76], 'accent'], [23.4, 25.2, [590, 1157, 996, 217], 'good']],
   caps: [[12.9, 'Two companies write one bearing differently. Text similarity: only 0.833.'],
          [18.6, 'Every specification agrees, field by field. The brand is ignored.'],
          [22.9, 'Match: 0.971, on specifications, not spelling.']] },
 { step: '3 · THE BLOCK', t: [25.4, 38.6], imgs: [[25.4, 'block']],
   cams: [[25.4, [584, 226, 1012]], [29.2, [584, 232, 1012]], [30.2, [560, 548, 1080]], [33.6, [560, 560, 1080]], [34.6, [570, 874, 1036]], [38.6, [576, 884, 1024]]],
   cur: [[25.7, [1300, 700]], [27.2, [1500, 530]], [29.6, [1500, 530]], [31.0, [1050, 760]], [34.2, [1050, 760]], [35.6, [1000, 1030]], [38.6, [1000, 1030]]],
   clicks: [], rings: [[27.4, 29.8, [590, 477, 996, 111], 'danger'], [30.9, 34.2, [590, 708, 996, 94], 'danger'], [35.2, 38.4, [590, 969, 996, 111], 'accent']],
   caps: [[25.7, 'Now the reverse: one character apart. Text similarity: 0.989.'],
          [30.2, 'Material grade is a veto field. Refused, whatever else agrees.'],
          [34.6, 'It shows what would change it: the same grade would score 0.956.']] },
 { step: '4 · CREATION GATE', t: [38.6, 51.2], imgs: [[38.6, 'gate_a'], [45.3, 'gate_b']],
   cams: [[38.6, [570, 390, 1036]], [51.2, [570, 400, 1036]]],
   cur: [[38.9, [1300, 900]], [40.6, [1250, 700]], [43.6, [1250, 700]], [45.0, [690, 492]], [46.4, [690, 492]], [48.0, [1100, 760]], [51.2, [1100, 760]]],
   clicks: [45.2], rings: [[40.7, 44.4, [590, 669, 996, 70], 'good'], [46.4, 51.0, [590, 669, 996, 137], 'danger']],
   caps: [[38.9, 'Before a code is issued, the gate checks it. Duplicate? Already catalogued.'],
          [45.6, 'A 6205 with a 6206’s size contradicts itself. Nothing is issued.']] },
 { step: '5 · REVIEW QUEUE', t: [51.2, 62.4], imgs: [[51.2, 'review_a']],
   cams: [[51.2, [570, 400, 1036]], [62.4, [570, 410, 1036]]],
   cur: [[51.5, [1300, 900]], [53.2, [880, 510]], [56.2, [880, 510]], [57.8, [1000, 772]], [62.4, [1000, 772]]],
   clicks: [], rings: [[53.3, 56.6, [590, 486, 996, 46], 'accent'], [57.8, 62.2, [590, 676, 996, 118], 'danger']],
   caps: [[51.5, 'Only uncertain cases reach a person: one record, its best candidates.'],
          [56.8, 'It says what it could not verify, so the reviewer knows where to look.']] },
 { step: '6 · REAL TENDER TEXT', t: [62.4, 74.0], imgs: [[62.4, 'real_top']],
   cams: [[62.4, [570, 470, 1036]], [74.0, [570, 480, 1036]]],
   cur: [[62.7, [1300, 950]], [64.4, [900, 622]], [67.6, [900, 622]], [69.2, [1000, 806]], [74.0, [1000, 806]]],
   clicks: [], rings: [[64.5, 67.9, [590, 570, 996, 314], 'accent'], [69.2, 73.8, [590, 800, 996, 42], 'danger']],
   caps: [[62.7, 'Real tender text from NTPC and Oil India, read into facts.'],
          [68.2, '101.60 mm and 4 inch: the same pipe. Grade unstated, so a person confirms.']] },
 { step: '7 · THE EVIDENCE', t: [74.0, 87.2], imgs: [[74.0, 'dashboard']],
   cams: [[74.0, [570, 960, 1036]], [81.0, [570, 975, 1036]], [82.2, [570, 1440, 1036]], [87.2, [570, 1450, 1036]]],
   cur: [[74.3, [1300, 1400]], [76.6, [760, 1150]], [81.0, [760, 1150]], [82.8, [900, 1762]], [87.2, [900, 1762]]],
   clicks: [], rings: [[76.8, 81.2, [590, 1082, 996, 158], 'good'], [83.2, 87.0, [590, 1741, 996, 38], 'good']],
   caps: [[74.3, 'The evidence, side by side, never blended.'],
          [77.4, '15,000 records: 860 merged, 0 wrong. Real tender text: 4 merged, 0 wrong.'],
          [82.2, 'Text matchers on the same records: 1,953 to 3,783 wrong merges.']] },
 { step: '8 · AUDIT TRAIL', t: [87.2, 99.4], imgs: [[87.2, 'audit_a'], [91.6, 'audit_b']],
   cams: [[87.2, [570, 220, 1036]], [99.4, [570, 230, 1036]]],
   cur: [[87.5, [1100, 750]], [90.6, [1512, 556]], [91.8, [1512, 556]], [93.4, [1000, 598]], [99.4, [1000, 598]]],
   clicks: [91.5], rings: [[92.6, 99.2, [590, 519, 996, 106], 'good']],
   caps: [[87.5, 'Every decision is sealed to the one before it.'],
          [92.4, 'Change one word in the log, and the check catches it.']] },
];
const COLORS = { danger: '#B42318', accent: '#0F4C9C', good: '#0B6E3A' };

// ---------------- build DOM
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const eout = (x) => 1 - Math.pow(1 - x, 3);
const einout = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
const IMG = {};
SHOTS.forEach((s, si) => {
  s.imgs.forEach(([_, name]) => { if (!IMG[name]) { const im = document.createElement('img'); im.src = 'demo_shots/' + name + '.png'; $('imgs').appendChild(im); IMG[name] = im; } });
  s.ringEls = s.rings.map(([a, b, r, c]) => { const d = document.createElement('div'); d.className = 'ring';
    Object.assign(d.style, { left: r[0] + 'px', top: r[1] + 'px', width: r[2] + 'px', height: r[3] + 'px', borderColor: COLORS[c] });
    $('rings').appendChild(d); return d; });
});
window.ready = () => Object.values(IMG).every((im) => im.complete && im.naturalWidth > 0);

function keyed(list, t) {            // [[t, value], ...] -> eased interpolation of arrays
  if (t <= list[0][0]) return list[0][1];
  for (let i = 0; i < list.length - 1; i++) {
    const [ta, va] = list[i], [tb, vb] = list[i + 1];
    if (t <= tb) { const x = einout(prog(t, ta, tb)); return va.map((v, k) => lerp(v, vb[k], x)); }
  }
  return list[list.length - 1][1];
}

let lastCap = '';
window.render = function (t) {
  // opening / closing cards
  $('open').style.opacity = t < OPEN[1] ? 1 - prog(t, OPEN[1] - 0.35, OPEN[1]) : 0;
  $('end').style.opacity = prog(t, END[0], END[0] + 0.4);
  const s = SHOTS.find((x) => t >= x.t[0] && t < x.t[1]);
  for (const im of Object.values(IMG)) im.style.opacity = 0;
  SHOTS.forEach((x) => x.ringEls.forEach((d) => d.style.opacity = 0));
  const vis = !!s;
  for (const id of ['band', 'cap', 'tag', 'step', 'cam']) $(id).style.visibility = vis ? 'visible' : 'hidden';
  if (!s) return;
  // dip at shot edges
  const edge = Math.min(prog(t, s.t[0], s.t[0] + 0.3), 1 - prog(t, s.t[1] - 0.3, s.t[1]));
  $('cam').style.opacity = edge;
  // images, crossfade on a state change
  s.imgs.forEach(([ta, name], i) => {
    const next = s.imgs[i + 1];
    let o = t >= ta ? 1 : 0;
    if (i > 0) o = prog(t, ta, ta + 0.25);
    if (next && t >= next[0] + 0.25) o = 0;
    if (o > 0) IMG[name].style.opacity = o;
  });
  // camera
  const r = keyed(s.cams, t), z = 1920 / r[2];
  $('cam').style.transform = `translate(${-r[0] * z}px, ${-r[1] * z}px) scale(${z})`;
  // rings
  s.rings.forEach(([a, b], i) => { s.ringEls[i].style.opacity = prog(t, a, a + 0.3) * (1 - prog(t, b - 0.3, b)); });
  // cursor, kept at a constant size on screen
  const c = keyed(s.cur, t);
  const cin = prog(t, s.cur[0][0] - 0.3, s.cur[0][0]);
  $('cursor').style.opacity = cin * edge;
  $('cursor').style.transform = `translate(${c[0] - 4 / z}px, ${c[1] - 2 / z}px) scale(${1 / z})`;
  // click ripple + press
  let rip = 0, rc = null;
  for (const k of s.clicks) if (t >= k && t < k + 0.55) { rip = prog(t, k, k + 0.55); rc = keyed(s.cur, k); }
  if (rc) { const rad = (10 + 34 * eout(rip)) / z;
    Object.assign($('ripple').style, { left: rc[0] - rad + 'px', top: rc[1] - rad + 'px', width: 2 * rad + 'px', height: 2 * rad + 'px',
      opacity: 1 - rip, borderWidth: 3 / z + 'px' }); } else $('ripple').style.opacity = 0;
  // band, step tag, captions
  $('step').textContent = s.step;
  $('step').style.opacity = prog(t, s.t[0] + 0.1, s.t[0] + 0.4) * (1 - prog(t, s.t[1] - 0.3, s.t[1]));
  let cap = null, ca = 0, cb = s.t[1];
  s.caps.forEach(([a, text], i) => { if (t >= a) { cap = text; ca = a; cb = s.caps[i + 1] ? s.caps[i + 1][0] : s.t[1]; } });
  $('cap').textContent = cap || '';
  $('cap').style.opacity = cap ? prog(t, ca, ca + 0.3) * (1 - prog(t, cb - 0.2, cb)) : 0;
  $('cap').style.transform = `translateY(${(1 - eout(prog(t, ca, ca + 0.35))) * 14}px)`;
};
window.render(0);
</script>
</body></html>
